services:
  - type: web
    name: errandly
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    disk:
      name: errandly-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.1-pro-preview
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APP_URL
        sync: false
